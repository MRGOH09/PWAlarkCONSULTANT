<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME Education - 甘特图时间表</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#00b96b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
            font-size: 14px;
        }
        
        .header {
            background: linear-gradient(135deg, #0f766e, #16a34a);
            color: white;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.22);
        }
        
        .header h1 {
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
        }
        
        .nav-tabs {
            background: white;
            display: flex;
            border-bottom: 1px solid #d9e2ec;
            overflow-x: auto;
            padding: 0 1rem;
        }
        
        .nav-tab {
            padding: 0.9rem 1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.3s ease;
            color: #52616b;
        }
        
        .nav-tab.active {
            border-bottom-color: #0f766e;
            color: #0f766e;
            font-weight: bold;
        }
        
        .controls {
            background: white;
            padding: 1rem;
            border-bottom: 1px solid #d9e2ec;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
        }
        
        .filter-label {
            font-weight: bold;
            color: #666;
            margin-right: 0.5rem;
        }
        
        .filter-btn {
            padding: 0.38rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #fff;
            color: #475569;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .clear-filter-btn {
            padding: 0.38rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            color: #334155;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .filter-scope {
            color: #64748b;
            font-size: 0.86rem;
            font-weight: 700;
        }

        .filter-scope strong {
            color: #0f766e;
        }

        .sync-status {
            background: #ffffff;
            border-bottom: 1px solid #d9e2ec;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            color: #64748b;
            font-size: 0.86rem;
        }

        .sync-status strong {
            color: #0f766e;
        }

        .refresh-btn {
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #ffffff;
            color: #0f766e;
            padding: 0.4rem 0.85rem;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .gantt-container {
            background: white;
            margin: 1rem;
            border-radius: 8px;
            border: 1px solid #d9e2ec;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        
        .gantt-header {
            background: #ffffff;
            padding: 1rem;
            border-bottom: 1px solid #d9e2ec;
            font-weight: bold;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .gantt-subtitle {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .gantt-content {
            overflow-x: auto;
            background: #f8fafc;
        }
        
        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .gantt-table th,
        .gantt-table td {
            border: 1px solid #e0e0e0;
            padding: 0.5rem;
            text-align: center;
            vertical-align: middle;
        }
        
        .gantt-table th {
            background: #f8f9fa;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .teacher-name {
            background: #fff;
            font-weight: bold;
            color: #00b96b;
            text-align: left;
            min-width: 80px;
        }
        
        .time-slot {
            position: relative;
            height: 40px;
            min-width: 80px;
        }
        
        .schedule-block {
            background: linear-gradient(45deg, #00b96b, #52c41a);
            color: white;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.8rem;
            text-align: center;
            margin: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .schedule-block:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,185,107,0.3);
        }
        
        .schedule-block.pu { background: linear-gradient(45deg, #1890ff, #40a9ff); }
        .schedule-block.hm { background: linear-gradient(45deg, #722ed1, #9254de); }
        .schedule-block.subang { background: linear-gradient(45deg, #fa541c, #ff7a45); }

        .timeline-chart {
            --day-col: 118px;
            --hour-width: 86px;
            --slot-height: 76px;
            min-width: calc(var(--day-col) + (15 * var(--hour-width)));
            padding-bottom: 0.75rem;
        }

        .timeline-hours,
        .timeline-row {
            display: grid;
            grid-template-columns: var(--day-col) repeat(15, var(--hour-width));
        }

        .timeline-hours {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #ffffff;
            border-bottom: 1px solid #d9e2ec;
        }

        .timeline-corner,
        .timeline-hour,
        .timeline-day {
            padding: 0.75rem 0.7rem;
            font-weight: 700;
        }

        .timeline-corner,
        .timeline-day {
            position: sticky;
            left: 0;
            z-index: 2;
            background: #ffffff;
            color: #0f766e;
            border-right: 1px solid #d9e2ec;
        }

        .timeline-corner {
            z-index: 4;
        }

        .timeline-hour {
            color: #64748b;
            font-size: 0.78rem;
            text-align: left;
            border-right: 1px solid #edf2f7;
        }

        .timeline-row {
            min-height: calc(var(--slot-height) * var(--lanes, 1) + 1rem);
            border-bottom: 1px solid #e5edf5;
        }

        .timeline-day {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
        }

        .timeline-lane {
            position: relative;
            grid-column: 2 / -1;
            min-height: calc(var(--slot-height) * var(--lanes, 1) + 1rem);
            background:
                repeating-linear-gradient(
                    to right,
                    #ffffff 0,
                    #ffffff calc(var(--hour-width) - 1px),
                    #e8eef5 calc(var(--hour-width) - 1px),
                    #e8eef5 var(--hour-width)
                );
        }

        .timeline-empty {
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .timeline-block {
            position: absolute;
            top: calc(0.5rem + (var(--lane, 0) * var(--slot-height)));
            left: calc(var(--start) * var(--hour-width));
            width: max(calc(var(--duration) * var(--hour-width) - 8px), 74px);
            height: 62px;
            border-radius: 8px;
            padding: 0.42rem 0.55rem;
            color: white;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
            overflow: hidden;
            cursor: pointer;
        }

        .timeline-block:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
        }

        .timeline-block.pu { background: linear-gradient(135deg, #2563eb, #06b6d4); }
        .timeline-block.hm { background: linear-gradient(135deg, #7c3aed, #db2777); }
        .timeline-block.subang { background: linear-gradient(135deg, #ea580c, #f59e0b); }
        .timeline-block.default-campus { background: linear-gradient(135deg, #0f766e, #22c55e); }

        .timeline-campus {
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.15rem;
        }

        .timeline-teachers,
        .timeline-time {
            font-size: 0.72rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-time {
            opacity: 0.86;
        }

        .timeline-duration {
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1.1;
            opacity: 0.95;
            white-space: nowrap;
        }

        .timeline-count {
            position: absolute;
            right: 0.5rem;
            top: 0.45rem;
            min-width: 1.5rem;
            padding: 0.12rem 0.42rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
        
        .summary-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .summary-card h3 {
            color: #00b96b;
            margin-bottom: 0.5rem;
        }
        
        .summary-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .hours-table-wrap {
            overflow-x: auto;
            background: #ffffff;
        }

        .hours-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
        }

        .hours-table th,
        .hours-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .hours-table th {
            background: #f8fafc;
            color: #475569;
            font-size: 0.82rem;
        }

        .hours-table td {
            color: #1e293b;
        }

        .hours-table .number-cell {
            font-weight: 800;
            color: #0f766e;
            white-space: nowrap;
        }

        .hours-table .muted-cell {
            color: #64748b;
            white-space: nowrap;
        }

        .edit-modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.48);
        }

        .edit-modal.open {
            display: flex;
        }

        .edit-dialog {
            width: min(420px, 100%);
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.25);
            overflow: hidden;
        }

        .edit-header {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .edit-title {
            font-weight: 800;
            color: #1e293b;
        }

        .edit-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
        }

        .edit-body {
            padding: 1rem;
            display: grid;
            gap: 0.85rem;
        }

        .edit-meta {
            display: grid;
            gap: 0.35rem;
            padding: 0.75rem;
            border-radius: 8px;
            background: #f8fafc;
            color: #475569;
            font-size: 0.9rem;
        }

        .edit-field {
            display: grid;
            gap: 0.35rem;
        }

        .edit-field label {
            font-weight: 700;
            color: #334155;
            font-size: 0.86rem;
        }

        .edit-field input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        .edit-error {
            min-height: 1.2rem;
            color: #dc2626;
            font-size: 0.86rem;
        }

        .teacher-picker {
            display: none;
            gap: 0.45rem;
        }

        .teacher-picker.open {
            display: grid;
        }

        .teacher-choice {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            padding: 0.65rem 0.75rem;
            text-align: left;
            color: #1e293b;
            cursor: pointer;
            font-weight: 700;
        }

        .teacher-choice:hover {
            border-color: #0f766e;
            background: #f0fdfa;
        }

        .edit-actions {
            padding: 1rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
        }

        .edit-button {
            padding: 0.6rem 0.95rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            font-weight: 700;
        }

        .edit-button.primary {
            border-color: #0f766e;
            background: #0f766e;
            color: #ffffff;
        }

        .edit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            body {
                font-size: 13px;
            }

            .header {
                padding: 0.85rem 0.75rem;
            }

            .header h1 {
                font-size: 1.1rem;
            }

            .header p {
                font-size: 0.82rem;
            }

            .nav-tabs {
                padding: 0 0.5rem;
            }

            .nav-tab {
                padding: 0.72rem 0.75rem;
                font-size: 0.86rem;
            }

            .controls {
                flex-wrap: nowrap;
                align-items: center;
                gap: 0.6rem;
                overflow-x: auto;
                padding: 0.65rem 0.7rem;
                -webkit-overflow-scrolling: touch;
            }

            .controls::-webkit-scrollbar,
            .gantt-content::-webkit-scrollbar,
            .nav-tabs::-webkit-scrollbar {
                display: none;
            }

            .filter-group {
                flex: 0 0 auto;
                flex-wrap: nowrap;
                gap: 0.25rem;
                justify-content: flex-start;
            }

            .filter-label {
                margin-right: 0.25rem;
                white-space: nowrap;
            }

            .filter-btn,
            .clear-filter-btn {
                padding: 0.34rem 0.65rem;
                font-size: 0.78rem;
                white-space: nowrap;
            }

            .filter-scope {
                white-space: nowrap;
                font-size: 0.78rem;
            }

            .sync-status {
                padding: 0.55rem 0.7rem;
                font-size: 0.78rem;
            }
            
            .gantt-table th,
            .gantt-table td {
                padding: 0.3rem;
                font-size: 0.8rem;
            }
            
            .schedule-block {
                font-size: 0.7rem;
                padding: 1px 4px;
            }

            .gantt-container {
                margin: 0.55rem 0;
                border-left: none;
                border-right: none;
                border-radius: 0;
            }

            .gantt-header {
                padding: 0.7rem;
            }

            .gantt-subtitle {
                font-size: 0.76rem;
                white-space: nowrap;
            }

            .gantt-content {
                -webkit-overflow-scrolling: touch;
            }

            .timeline-chart {
                --day-col: 58px;
                --hour-width: 60px;
                --slot-height: 66px;
            }

            .timeline-corner,
            .timeline-hour,
            .timeline-day {
                padding: 0.55rem 0.4rem;
            }

            .timeline-corner,
            .timeline-day {
                font-size: 0.82rem;
            }

            .timeline-hour {
                font-size: 0.7rem;
            }

            .timeline-row,
            .timeline-lane {
                min-height: calc(var(--slot-height) * var(--lanes, 1) + 0.75rem);
            }

            .timeline-block {
                top: calc(0.38rem + (var(--lane, 0) * var(--slot-height)));
                width: max(calc(var(--duration) * var(--hour-width) - 6px), 56px);
                height: 54px;
                border-radius: 7px;
                padding: 0.32rem 0.42rem;
            }

            .timeline-campus {
                font-size: 0.66rem;
                margin-bottom: 0.08rem;
            }

            .timeline-teachers,
            .timeline-time {
                font-size: 0.61rem;
                line-height: 1.18;
            }

            .timeline-duration {
                font-size: 0.58rem;
                font-weight: 800;
                line-height: 1.1;
            }

            .timeline-count {
                right: 0.32rem;
                top: 0.32rem;
                min-width: 1.25rem;
                padding: 0.08rem 0.32rem;
                font-size: 0.62rem;
            }

            .edit-dialog {
                width: min(420px, calc(100vw - 1rem));
            }

            .edit-header,
            .edit-body,
            .edit-actions {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ME Education 甘特图时间表</h1>
        <p>顾问工作时间可视化管理</p>
        <div style="margin-top: 10px;">
            <a href="/" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; margin-right: 10px;">🏠 首页</a>
            <a href="/test.html" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px;">🔧 测试</a>
        </div>
    </div>
    
    <div class="nav-tabs">
        <div class="nav-tab" data-view="teacher">👨‍🏫 按老师查看</div>
        <div class="nav-tab active" data-view="schedule">🏫 按时间段查看</div>
    </div>
    
    <div class="controls">
        <div class="filter-group" id="teacher-filter">
            <span class="filter-label">老师:</span>
            <button class="filter-btn active" data-teacher="all">全部</button>
        </div>

        <div class="filter-group">
            <span class="filter-label">周别:</span>
            <button class="filter-btn active" data-week="全部">全部</button>
            <button class="filter-btn" data-week="第1周">第1周</button>
        </div>

        <div class="filter-group">
            <span class="filter-label">星期:</span>
            <button class="filter-btn active" data-day="all">全部</button>
            <button class="filter-btn" data-day="星期一">周一</button>
            <button class="filter-btn" data-day="星期二">周二</button>
            <button class="filter-btn" data-day="星期三">周三</button>
            <button class="filter-btn" data-day="星期四">周四</button>
            <button class="filter-btn" data-day="星期五">周五</button>
            <button class="filter-btn" data-day="星期六">周六</button>
            <button class="filter-btn" data-day="星期日">周日</button>
        </div>
        
        <div class="filter-group">
            <span class="filter-label">校区:</span>
            <button class="filter-btn active" data-campus="all">全部</button>
            <button class="filter-btn" data-campus="PU">PU</button>
            <button class="filter-btn" data-campus="HM">HM</button>
            <button class="filter-btn" data-campus="SUBANG">SUBANG</button>
        </div>

        <div class="filter-group">
            <button class="clear-filter-btn" id="clear-filters" type="button">清除筛选</button>
            <span class="filter-scope" id="filter-scope">当前范围：<strong>全部</strong></span>
        </div>
    </div>

    <div class="sync-status">
        <div id="sync-status-text">正在同步 Lark 数据...</div>
        <button class="refresh-btn" id="refresh-btn" type="button">刷新</button>
    </div>
    
    <div id="content">
        <div class="loading">正在加载甘特图数据...</div>
    </div>

    <div class="edit-modal" id="edit-modal" aria-hidden="true">
        <div class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-title">
            <form id="edit-form">
                <div class="edit-header">
                    <div class="edit-title" id="edit-title">修改老师时间</div>
                    <button class="edit-close" type="button" id="edit-close" aria-label="关闭">×</button>
                </div>
                <div class="edit-body">
                    <div class="edit-meta" id="edit-meta"></div>
                    <div class="teacher-picker" id="teacher-picker"></div>
                    <div class="edit-field">
                        <label for="edit-checkin">进 (Check-in)</label>
                        <input id="edit-checkin" name="checkin" placeholder="例如 7.30 AM" autocomplete="off" required>
                    </div>
                    <div class="edit-field">
                        <label for="edit-checkout">出 (Check-out)</label>
                        <input id="edit-checkout" name="checkout" placeholder="例如 11.00 AM" autocomplete="off" required>
                    </div>
                    <div class="edit-error" id="edit-error"></div>
                </div>
                <div class="edit-actions">
                    <button class="edit-button" type="button" id="edit-cancel">取消</button>
                    <button class="edit-button primary" type="submit" id="edit-submit">保存到 Lark</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/js/gantt.js"></script>
</body>
</html>
