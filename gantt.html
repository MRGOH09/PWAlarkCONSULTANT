<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME Education - 甘特图时间表</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#00b96b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
            font-size: 14px;
        }
        
        .header {
            background: linear-gradient(135deg, #0f766e, #16a34a);
            color: white;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.22);
        }
        
        .header h1 {
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
        }
        
        .nav-tabs {
            background: white;
            display: flex;
            border-bottom: 1px solid #d9e2ec;
            overflow-x: auto;
            padding: 0 1rem;
        }
        
        .nav-tab {
            padding: 0.9rem 1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.3s ease;
            color: #52616b;
        }
        
        .nav-tab.active {
            border-bottom-color: #0f766e;
            color: #0f766e;
            font-weight: bold;
        }
        
        .controls {
            background: white;
            padding: 1rem;
            border-bottom: 1px solid #d9e2ec;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
        }
        
        .filter-label {
            font-weight: bold;
            color: #666;
            margin-right: 0.5rem;
        }
        
        .filter-btn {
            padding: 0.38rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #fff;
            color: #475569;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }
        
        .gantt-container {
            background: white;
            margin: 1rem;
            border-radius: 8px;
            border: 1px solid #d9e2ec;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        
        .gantt-header {
            background: #ffffff;
            padding: 1rem;
            border-bottom: 1px solid #d9e2ec;
            font-weight: bold;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .gantt-subtitle {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .gantt-content {
            overflow-x: auto;
            background: #f8fafc;
        }
        
        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .gantt-table th,
        .gantt-table td {
            border: 1px solid #e0e0e0;
            padding: 0.5rem;
            text-align: center;
            vertical-align: middle;
        }
        
        .gantt-table th {
            background: #f8f9fa;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .teacher-name {
            background: #fff;
            font-weight: bold;
            color: #00b96b;
            text-align: left;
            min-width: 80px;
        }
        
        .time-slot {
            position: relative;
            height: 40px;
            min-width: 80px;
        }
        
        .schedule-block {
            background: linear-gradient(45deg, #00b96b, #52c41a);
            color: white;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.8rem;
            text-align: center;
            margin: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .schedule-block:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,185,107,0.3);
        }
        
        .schedule-block.pu { background: linear-gradient(45deg, #1890ff, #40a9ff); }
        .schedule-block.hm { background: linear-gradient(45deg, #722ed1, #9254de); }
        .schedule-block.subang { background: linear-gradient(45deg, #fa541c, #ff7a45); }

        .timeline-chart {
            --day-col: 118px;
            --hour-width: 86px;
            --slot-height: 46px;
            min-width: calc(var(--day-col) + (15 * var(--hour-width)));
            padding-bottom: 0.75rem;
        }

        .timeline-hours,
        .timeline-row {
            display: grid;
            grid-template-columns: var(--day-col) repeat(15, var(--hour-width));
        }

        .timeline-hours {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #ffffff;
            border-bottom: 1px solid #d9e2ec;
        }

        .timeline-corner,
        .timeline-hour,
        .timeline-day {
            padding: 0.75rem 0.7rem;
            font-weight: 700;
        }

        .timeline-corner,
        .timeline-day {
            position: sticky;
            left: 0;
            z-index: 2;
            background: #ffffff;
            color: #0f766e;
            border-right: 1px solid #d9e2ec;
        }

        .timeline-corner {
            z-index: 4;
        }

        .timeline-hour {
            color: #64748b;
            font-size: 0.78rem;
            text-align: left;
            border-right: 1px solid #edf2f7;
        }

        .timeline-row {
            min-height: calc(var(--slot-height) * var(--lanes, 1) + 1.5rem);
            border-bottom: 1px solid #e5edf5;
        }

        .timeline-day {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
        }

        .timeline-lane {
            position: relative;
            grid-column: 2 / -1;
            min-height: calc(var(--slot-height) * var(--lanes, 1) + 1.5rem);
            background:
                repeating-linear-gradient(
                    to right,
                    #ffffff 0,
                    #ffffff calc(var(--hour-width) - 1px),
                    #e8eef5 calc(var(--hour-width) - 1px),
                    #e8eef5 var(--hour-width)
                );
        }

        .timeline-empty {
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .timeline-block {
            position: absolute;
            top: calc(0.75rem + (var(--lane, 0) * var(--slot-height)));
            left: calc(var(--start) * var(--hour-width));
            width: max(calc(var(--duration) * var(--hour-width) - 8px), 74px);
            min-height: 38px;
            border-radius: 8px;
            padding: 0.42rem 0.55rem;
            color: white;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
            overflow: hidden;
            cursor: pointer;
        }

        .timeline-block:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.2);
        }

        .timeline-block.pu { background: linear-gradient(135deg, #2563eb, #06b6d4); }
        .timeline-block.hm { background: linear-gradient(135deg, #7c3aed, #db2777); }
        .timeline-block.subang { background: linear-gradient(135deg, #ea580c, #f59e0b); }
        .timeline-block.default-campus { background: linear-gradient(135deg, #0f766e, #22c55e); }

        .timeline-campus {
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.15rem;
        }

        .timeline-teachers,
        .timeline-time {
            font-size: 0.72rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-time {
            opacity: 0.86;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
        
        .summary-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .summary-card h3 {
            color: #00b96b;
            margin-bottom: 0.5rem;
        }
        
        .summary-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                justify-content: center;
            }
            
            .gantt-table th,
            .gantt-table td {
                padding: 0.3rem;
                font-size: 0.8rem;
            }
            
            .schedule-block {
                font-size: 0.7rem;
                padding: 1px 4px;
            }

            .timeline-chart {
                --day-col: 86px;
                --hour-width: 72px;
            }

            .timeline-corner,
            .timeline-hour,
            .timeline-day {
                padding: 0.65rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ME Education 甘特图时间表</h1>
        <p>顾问工作时间可视化管理</p>
        <div style="margin-top: 10px;">
            <a href="/" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; margin-right: 10px;">🏠 首页</a>
            <a href="/test.html" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px;">🔧 测试</a>
        </div>
    </div>
    
    <div class="nav-tabs">
        <div class="nav-tab" data-view="teacher">👨‍🏫 按老师查看</div>
        <div class="nav-tab active" data-view="schedule">🏫 按时间段查看</div>
        <div class="nav-tab" data-view="summary">📊 统计总览</div>
    </div>
    
    <div class="controls">
        <div class="filter-group">
            <span class="filter-label">星期:</span>
            <button class="filter-btn active" data-day="all">全部</button>
            <button class="filter-btn" data-day="星期一">周一</button>
            <button class="filter-btn" data-day="星期二">周二</button>
            <button class="filter-btn" data-day="星期三">周三</button>
            <button class="filter-btn" data-day="星期四">周四</button>
            <button class="filter-btn" data-day="星期五">周五</button>
            <button class="filter-btn" data-day="星期六">周六</button>
            <button class="filter-btn" data-day="星期日">周日</button>
        </div>
        
        <div class="filter-group">
            <span class="filter-label">校区:</span>
            <button class="filter-btn active" data-campus="all">全部</button>
            <button class="filter-btn" data-campus="PU">PU</button>
            <button class="filter-btn" data-campus="HM">HM</button>
            <button class="filter-btn" data-campus="SUBANG">SUBANG</button>
        </div>
        
        <div class="filter-group" id="teacher-filter" style="display:none;">
            <span class="filter-label">老师:</span>
            <button class="filter-btn active" data-teacher="all">全部</button>
        </div>
    </div>
    
    <div id="content">
        <div class="loading">正在加载甘特图数据...</div>
    </div>
    
    <script src="/js/gantt.js"></script>
</body>
</html>
